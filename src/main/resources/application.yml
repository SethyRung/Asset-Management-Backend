spring:
  port: ${SPRING_PORT}
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

application:
  client-url: ${APP_CLIENT_URL}
  server-url: ${APP_SERVER_URL}
  security:
    jwt:
      access-token:
        secret-key: ${APP_SECURITY_JWT_ACCESS_TOKEN_SECRET_KEY}
        expiration: ${APP_SECURITY_JWT_ACCESS_TOKEN_EXPIRATION}
      refresh-token:
        secret-key: ${APP_SECURITY_JWT_REFRESH_TOKEN_SECRET_KEY}
        expiration: ${APP_SECURITY_JWT_REFRESH_TOKEN_EXPIRATION}
  smtp:
    api-key: ${APP_SMTP_API_KEY}
    domain: ${APP_SMTP_DOMAIN}
  file:
    upload-dir: ${APP_FILE_UPLOAD_DIR}